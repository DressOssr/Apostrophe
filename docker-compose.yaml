services:
  db:
    image: mongo:7.0
    container_name: apostrophe-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-apostrophe}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-apostrophe}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apostrophe-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apostrophe-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APOS_MONGODB_URI=mongodb://${MONGO_USER:-apostrophe}:${MONGO_PASSWORD:-apostrophe}@db:27017/apostrophe?authSource=admin
      - APOS_CLUSTER_PROCESSES=${APOS_CLUSTER_PROCESSES:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public/uploads:/srv/www/apostrophe/public/uploads
      - ./data:/srv/www/apostrophe/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - apostrophe-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  apostrophe-network:
    driver: bridge
