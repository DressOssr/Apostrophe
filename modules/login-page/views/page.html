{% extends "layout.html" %}

{% block main %}
  <section class="mx-auto max-w-md px-4 py-16">
    <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
      <div class="mb-8">
        <p class="mb-2 text-sm font-semibold uppercase tracking-[0.18em] text-[#4caf4f]">
          Account
        </p>
        <h1 class="m-0 text-3xl font-bold text-slate-900">
          Sign in
        </h1>
      </div>

      {% if data.query.error %}
        <div class="mb-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
          {{ data.query.error }}
        </div>
      {% endif %}

      {% if data.user %}
        <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">
          You are already signed in as {{ data.user.username }}.
        </div>
      {% else %}
        <form method="post" action="/auth/login" class="space-y-5">
          <input type="hidden" name="next" value="/" />

          <div>
            <label for="login-username" class="mb-2 block text-sm font-medium text-slate-700">
              Username or email
            </label>
            <input
              id="login-username"
              name="username"
              type="text"
              required
              class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900"
            />
          </div>

          <div>
            <label for="login-password" class="mb-2 block text-sm font-medium text-slate-700">
              Password
            </label>
            <input
              id="login-password"
              name="password"
              type="password"
              required
              class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900"
            />
          </div>

          <button
            type="submit"
            class="w-full rounded-xl bg-[#4caf4f] px-5 py-3 text-sm font-semibold text-white hover:bg-[#3f9f43]"
          >
            Sign in
          </button>
        </form>
      {% endif %}

      <p class="mt-6 text-sm text-slate-600">
        Don’t have an account?
        <a href="/sign-up" class="font-semibold text-[#4caf4f] no-underline hover:text-[#3f9f43]">
          Create one
        </a>
      </p>
    </div>
  </section>
{% endblock %}
